name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  file-size:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/check-file-size.sh 250

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SONGTHESAME_TEST_DB: Host=localhost;Username=postgres;Password=postgres;Database=postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore
      - run: dotnet build --no-restore -c Release
      - run: dotnet test --no-build -c Release

  web:
    runs-on: ubuntu-latest
    needs: backend # the backend build writes web/openapi/openapi.json used by the client generator
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build ../src/SongTheSame.Api -c Release
      - name: Install web dependencies
        run: |
          npm ci 2>&1 | tee npm-ci.log || { echo "::error title=npm ci failed::$(tail -n 30 npm-ci.log | tr '
' ' ' | cut -c1-1500)"; exit 1; }
      - run: npm run api:generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
